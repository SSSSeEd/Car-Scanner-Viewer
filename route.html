<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ルートタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f6f8f9; --fg: #141b21; --muted: #5b6a74; --line: #d6dde2;
  --accent: #e0861f; --sel: #1d6e8a; --good: #23845a; --danger: #c0443a;
  --cluster: #151c22; --cluster-fg: #e9eef2; --cluster-muted: #8a9aa5; --cluster-line: #2a353e;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Chakra Petch", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --surface: #182027; --surface-2: #1d262e; --fg: #e5ebef; --muted: #91a1ab; --line: #2a353e;
    --accent: #f2a04a; --sel: #63b6d3; --good: #5cc790; --danger: #ec7b70; --cluster: #0a0e11; --cluster-line: #222c34; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #182027; --surface-2: #1d262e; --fg: #e5ebef; --muted: #91a1ab; --line: #2a353e;
  --accent: #f2a04a; --sel: #63b6d3; --good: #5cc790; --danger: #ec7b70; --cluster: #0a0e11; --cluster-line: #222c34; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
header { background: var(--cluster); color: var(--cluster-fg); padding-top: env(safe-area-inset-top, 0px); }
header .wrap { padding-block: 16px 14px; }
h1 { margin: 0; font-size: 1.05rem; letter-spacing: .06em; }
h1 small { display: block; font-size: .72rem; font-weight: 400; color: var(--cluster-muted); letter-spacing: .02em; }
.btn { font: inherit; border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #1b1206; font-weight: 700; }
.btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.note { color: var(--muted); font-size: .82rem; }
.err { color: var(--danger); font-size: .88rem; }

/* route list */
.routes { display: grid; gap: 12px; margin-top: 16px; }
.route { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.route .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.route h2 { margin: 0; font-size: 1.1rem; }
.route .usual { font-size: .85rem; color: var(--muted); }
.route .usual b { color: var(--fg); font-family: var(--font-num); font-size: 1.05rem; }
.route .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.route .acts .btn-primary { flex: 1 1 auto; padding: 12px 16px; font-size: 1rem; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--sel); cursor: pointer; text-decoration: underline; font-size: .82rem; }
.more { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.more input { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); width: 100%; }
.runs { font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.opts { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 8px; }
.opts label { display: flex; gap: 10px; align-items: center; }
.opts input { width: 20px; height: 20px; accent-color: var(--accent); }

/* drive screen */
#drive { position: fixed; inset: 0; background: var(--cluster); color: var(--cluster-fg); display: flex; flex-direction: column;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#drive .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#drive .head b { font-size: 1.05rem; letter-spacing: .04em; }
#drive .gps { font-size: .78rem; color: var(--cluster-muted); }
#drive .main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; }
#d-label { color: var(--cluster-muted); font-size: .95rem; }
#d-big { font-family: var(--font-num); font-weight: 700; font-size: min(28vw, 9rem); line-height: 1; letter-spacing: .01em; }
#d-eta { font-size: 1.15rem; }
#d-eta .num { font-size: 1.35rem; font-weight: 600; }
#d-delta { font-size: 1.1rem; font-weight: 700; padding: 4px 14px; border-radius: 999px; background: #ffffff14; }
#d-delta.late { color: #ff9c90; } #d-delta.early { color: #7fe0ad; }
.bar { width: 100%; height: 8px; background: var(--cluster-line); border-radius: 4px; overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s; }
#d-sub { display: flex; justify-content: space-between; width: 100%; font-size: .85rem; color: var(--cluster-muted); }
#d-msg { min-height: 1.4em; font-size: .9rem; color: var(--cluster-muted); text-align: center; }
#d-msg.alert { color: #ff9c90; font-weight: 700; font-size: 1.1rem; }
#drive .foot { display: flex; gap: 10px; }
#drive .foot .btn { flex: 1; padding: 14px; font-size: 1rem; }
#drive .foot .btn:not(.btn-primary) { background: transparent; color: var(--cluster-fg); border-color: var(--cluster-line); }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: .9rem; max-width: calc(100% - 32px); z-index: 20; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>ルートタイマー<small>いつものルートで「あと何分」を、これまでの走行から計算します</small></h1>
</div></header>

<main class="wrap" id="home">
  <div class="routes" id="routes"></div>
  <div class="opts">
    <label><input type="checkbox" id="opt-brake"> 急ブレーキを声で知らせる（GPS の速度から判定）</label>
    <label><input type="checkbox" id="opt-voice" checked> 出発時に到着予定を読み上げる</label>
  </div>
  <p class="note">使い方：出発前にルートを選んで「出発」を押し、着いたら「到着」を押します。1回目でルートを覚え、2回目から「あと何分」と「いつもとの差」が出ます。走行中はこの画面を開いたままにしてください（画面を消したり別のアプリに切り替えると GPS が止まります）。</p>
  <p class="note" id="store-note"></p>
</main>

<section id="drive" hidden aria-live="polite">
  <div class="head"><b id="d-name"></b><span class="gps" id="d-gps">GPS を待っています…</span></div>
  <div class="main">
    <div id="d-label">あと</div>
    <div id="d-big">--:--</div>
    <div id="d-eta"></div>
    <div id="d-delta" hidden></div>
    <div class="bar"><i id="d-bar"></i></div>
    <div id="d-sub"><span id="d-elapsed"></span><span id="d-speed"></span></div>
  </div>
  <div id="d-msg"></div>
  <div class="foot">
    <button type="button" class="btn" id="d-cancel">やめる</button>
    <button type="button" class="btn btn-primary" id="d-arrive">到着</button>
  </div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const DEFAULT_ROUTES = [["school", "学校へ"], ["work", "バイトへ"], ["home", "学校から帰宅"]];
const STEP = 50;            // reference point spacing (m)
const MATCH_M = 80;         // max distance to count as "on route"
const MAX_RUNS = 40;
const BRAKE_KMH_S = 8;      // same threshold as the log viewer (8 km/h per second)

/* ---------- storage: artifact db when available, else localStorage ---------- */
let dbP = null;
function cloud() {
  if (!dbP) dbP = (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)).catch(() => null);
  return dbP;
}
const LS = "route-timer-v1";
function lsAll() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch { return {}; } }
function lsPut(id, doc) { try { const a = lsAll(); a[id] = doc; localStorage.setItem(LS, JSON.stringify(a)); } catch {} }
async function loadRoutes() {
  const map = new Map();
  for (const [id, doc] of Object.entries(lsAll())) map.set(id, doc);
  const db = await cloud();
  if (db) {
    try {
      const snap = await db.collection("routes").get();
      for (const d of snap.docs) map.set(d.id, d.data());
    } catch (e) { console.warn(e); }
  }
  for (const [i, [id, name]] of DEFAULT_ROUTES.entries())
    if (!map.has(id)) map.set(id, { name, order: i, ref: null, runs: [] });
  return [...map.entries()].map(([id, d]) => ({ id, ...d })).sort((a, b) => (a.order ?? 9) - (b.order ?? 9));
}
async function saveRoute(r) {
  const { id, ...doc } = r;
  lsPut(id, doc);
  const db = await cloud();
  if (db) { try { await db.doc("routes/" + id).set(doc); return true; } catch (e) { console.warn(e); return false; } }
  return true;
}
async function saveTrack(routeId, at, pts) {
  const db = await cloud();
  if (!db) return;
  try { await db.doc("tracks/" + routeId + "_" + at).set({ route: routeId, at, pts: pts.map(p => [Math.round(p.t), +p.lat.toFixed(5), +p.lon.toFixed(5), p.spd == null ? null : +p.spd.toFixed(1)]) }); }
  catch (e) { console.warn(e); }
}

/* ---------- geometry ---------- */
function dist(aLat, aLon, bLat, bLon) {
  const k = Math.PI / 180, x = (bLon - aLon) * k * Math.cos((aLat + bLat) / 2 * k), y = (bLat - aLat) * k;
  return Math.hypot(x, y) * 6371000;
}
// resample a track into points every STEP metres
function buildRef(track) {
  const lat = [track[0].lat], lon = [track[0].lon];
  let carry = 0;
  for (let i = 1; i < track.length; i++) {
    const a = track[i - 1], b = track[i], d = dist(a.lat, a.lon, b.lat, b.lon);
    let pos = STEP - carry;
    while (pos <= d) { const f = pos / d; lat.push(a.lat + (b.lat - a.lat) * f); lon.push(a.lon + (b.lon - a.lon) * f); pos += STEP; }
    carry = d - (pos - STEP);
  }
  const e = track[track.length - 1];
  if (dist(lat[lat.length - 1], lon[lon.length - 1], e.lat, e.lon) > STEP / 3) { lat.push(e.lat); lon.push(e.lon); }
  return { lat: lat.map(v => +v.toFixed(5)), lon: lon.map(v => +v.toFixed(5)) };
}
// seconds from departure at which the track passed each reference point (null if it didn't)
function timesAt(track, ref) {
  const n = ref.lat.length, out = new Array(n).fill(null);
  let j = 0;
  for (let k = 0; k < n; k++) {
    let best = Infinity, bj = -1, travelled = 0;
    for (let q = j; q < track.length; q++) {
      if (q > j) travelled += dist(track[q - 1].lat, track[q - 1].lon, track[q].lat, track[q].lon);
      if (travelled > 3000) break;
      const d = dist(ref.lat[k], ref.lon[k], track[q].lat, track[q].lon);
      if (d < best) { best = d; bj = q; }
    }
    if (bj >= 0 && best <= MATCH_M) { out[k] = Math.round(track[bj].t); j = bj; }
  }
  return out;
}
const median = a => { const s = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); if (!s.length) return NaN; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
// typical elapsed time and remaining time at each reference point
function profile(route) {
  if (!route.ref || !route.runs.length) return null;
  const n = route.ref.lat.length, el = [], rem = [];
  for (let k = 0; k < n; k++) {
    el.push(median(route.runs.map(r => r.t[k])));
    rem.push(median(route.runs.map(r => r.t[k] == null ? null : r.total - r.t[k])));
  }
  // fill gaps by interpolation so every point has a value
  for (const arr of [el, rem]) {
    for (let k = 0; k < n; k++) if (!isFinite(arr[k])) {
      let a = k - 1; while (a >= 0 && !isFinite(arr[a])) a--;
      let b = k + 1; while (b < n && !isFinite(arr[b])) b++;
      arr[k] = a >= 0 && b < n ? arr[a] + (arr[b] - arr[a]) * (k - a) / (b - a) : a >= 0 ? arr[a] : arr[b];
    }
  }
  return { el, rem, total: median(route.runs.map(r => r.total)) };
}

/* ---------- formatting ---------- */
const mmss = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const mins = s => `${Math.round(s / 60)}分`;
const hhmm = ms => { const d = new Date(ms); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg, ms = 3500) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), ms);
}
function say(text) {
  try { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
}
function opt(id, set) {
  const key = "route-timer-opt-" + id;
  try { if (set !== undefined) localStorage.setItem(key, set ? "1" : "0"); const v = localStorage.getItem(key); return v == null ? null : v === "1"; } catch { return null; }
}

/* ---------- home ---------- */
let ROUTES = [], open = null;
function renderHome() {
  $("routes").innerHTML = ROUTES.map(r => {
    const p = profile(r), n = r.runs.length;
    const tot = r.runs.map(x => x.total);
    const usual = p ? `いつも <b>${mins(p.total)}</b>${n >= 2 ? `（${mins(Math.min(...tot))}〜${mins(Math.max(...tot))}、${n}回）` : "（1回分の記録）"}`
      : r.ref ? "記録が足りません" : "まだ記録がありません。1回走るとルートを覚えます";
    const more = open === r.id ? `<div class="more">
        <label class="note" for="nm-${r.id}">ルートの名前</label>
        <input id="nm-${r.id}" value="${esc(r.name)}" maxlength="20">
        <div class="runs">${r.runs.slice().reverse().slice(0, 12).map(x => `<span class="num">${new Date(x.at).toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" })} ${hhmm(x.at)} 発 ${mmss(x.total)}</span>`).join("") || "記録なし"}</div>
        <div class="acts"><button type="button" class="btn" data-save="${r.id}">名前を保存</button>
        ${r.runs.length ? `<button type="button" class="btn" data-pop="${r.id}">最後の記録を消す</button>` : ""}
        ${r.ref ? `<button type="button" class="btn btn-danger" data-reset="${r.id}">ルートを覚え直す</button>` : ""}</div>
      </div>` : "";
    return `<div class="route">
      <div class="top"><h2>${esc(r.name)}</h2><button type="button" class="linkish" data-open="${r.id}">${open === r.id ? "閉じる" : "編集・記録"}</button></div>
      <div class="usual">${usual}</div>
      <div class="acts"><button type="button" class="btn btn-primary" data-go="${r.id}">出発</button></div>
      ${more}</div>`;
  }).join("");
}
$("routes").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const r = id => ROUTES.find(x => x.id === id);
  if (b.dataset.go) startDrive(r(b.dataset.go));
  else if (b.dataset.open) { open = open === b.dataset.open ? null : b.dataset.open; renderHome(); }
  else if (b.dataset.save) { const x = r(b.dataset.save); x.name = $("nm-" + x.id).value.trim() || x.name; await saveRoute(x); open = null; renderHome(); toast("保存しました"); }
  else if (b.dataset.pop) { const x = r(b.dataset.pop); if (!confirm("最後の記録を消しますか？")) return; x.runs.pop(); await saveRoute(x); renderHome(); }
  else if (b.dataset.reset) { const x = r(b.dataset.reset); if (!confirm(`「${x.name}」のルートと記録をすべて消して、次の走行で覚え直しますか？`)) return; x.ref = null; x.runs = []; await saveRoute(x); renderHome(); }
});
for (const id of ["brake", "voice"]) {
  const el = $("opt-" + id), v = opt(id); if (v != null) el.checked = v;
  el.addEventListener("change", () => opt(id, el.checked));
}

/* ---------- drive ---------- */
let D = null;
async function lockScreen() {
  try { if (navigator.wakeLock) D.lock = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => { if (D && document.visibilityState === "visible") lockScreen(); });

function startDrive(route) {
  if (!navigator.geolocation) { toast("この画面では位置情報が使えません"); return; }
  const prof = profile(route);
  D = { route, prof, t0: Date.now(), track: [], idx: 0, frac: 0, on: false, fixAt: 0, lastFix: null, spdHist: [], lastBrake: 0, announced: false, done: false };
  $("d-name").textContent = route.name;
  $("d-gps").textContent = "GPS を待っています…";
  $("d-msg").textContent = prof ? "" : (route.ref ? "" : "1回目：このルートを覚えています。着いたら「到着」を押してください。");
  $("d-msg").className = "";
  $("d-delta").hidden = true;
  $("d-bar").style.width = "0";
  $("home").hidden = true; $("drive").hidden = false;
  if (opt("brake") ?? $("opt-brake").checked) say("");   // unlock speech on iOS from this tap
  lockScreen();
  D.watch = navigator.geolocation.watchPosition(onFix, onGeoErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  D.tick = setInterval(paint, 1000);
  paint();
}
function onGeoErr(err) {
  if (!D) return;
  const msg = err.code === 1 ? "位置情報の利用が許可されていません。iPhone の設定 → プライバシー → 位置情報 で、使っているアプリ（Safari や Claude）を「使用中のみ許可」にしてください。"
    : "GPS の信号を待っています…";
  $("d-gps").textContent = err.code === 1 ? "位置情報オフ" : "GPS 待ち";
  $("d-msg").textContent = msg;
}
function onFix(pos) {
  if (!D || D.done) return;
  const c = pos.coords, now = pos.timestamp || Date.now();
  $("d-gps").textContent = `GPS ±${Math.round(c.accuracy)}m`;
  if (c.accuracy > 60) return;
  const t = (now - D.t0) / 1000;
  let spd = c.speed != null && c.speed >= 0 ? c.speed * 3.6 : null;
  const prev = D.track[D.track.length - 1];
  if (spd == null && prev && t > prev.t) spd = dist(prev.lat, prev.lon, c.latitude, c.longitude) / (t - prev.t) * 3.6;
  if (spd != null) checkBrake(t, spd);
  D.lastFix = { t, spd }; D.fixAt = now;
  if (prev && dist(prev.lat, prev.lon, c.latitude, c.longitude) < 3 && t - prev.t < 5) return;
  D.track.push({ t, lat: c.latitude, lon: c.longitude, spd });
  if (D.route.ref) match(c.latitude, c.longitude);
  paint();
  // automatic arrival once we have a learned route and reach its end
  const ref = D.route.ref;
  if (ref && D.on && D.idx >= ref.lat.length - 2 && dist(c.latitude, c.longitude, ref.lat[ref.lat.length - 1], ref.lon[ref.lon.length - 1]) < 60) finish(true);
}
function match(lat, lon) {
  const ref = D.route.ref, n = ref.lat.length;
  const lo = D.on ? Math.max(0, D.idx - 4) : 0, hi = D.on ? Math.min(n - 1, D.idx + 60) : n - 1;
  let best = Infinity, bk = -1;
  for (let k = lo; k <= hi; k++) { const d = dist(lat, lon, ref.lat[k], ref.lon[k]); if (d < best) { best = d; bk = k; } }
  if (bk < 0 || best > MATCH_M) { D.on = false; D.offSince = D.offSince || Date.now(); return; }
  // position between bk and its neighbour, as a fraction of a step
  let k = bk, f = 0;
  const nb = bk + 1 < n ? bk + 1 : bk;
  if (nb !== bk) {
    const ax = ref.lat[bk], ay = ref.lon[bk], dAB = dist(ax, ay, ref.lat[nb], ref.lon[nb]);
    const dAP = best, dBP = dist(lat, lon, ref.lat[nb], ref.lon[nb]);
    if (dAB > 0) f = Math.min(1, Math.max(0, (dAP * dAP - dBP * dBP + dAB * dAB) / (2 * dAB * dAB)));
  }
  D.idx = k; D.frac = f; D.on = true; D.offSince = 0;
}
function checkBrake(t, spd) {
  D.spdHist.push([t, spd]);
  while (D.spdHist.length && t - D.spdHist[0][0] > 3) D.spdHist.shift();
  const old = D.spdHist[0];
  if (!old || t - old[0] < 1.5) return;
  const rate = (old[1] - spd) / (t - old[0]);
  if (rate >= BRAKE_KMH_S && old[1] > 20 && Date.now() - D.lastBrake > 8000) {
    D.lastBrake = Date.now(); D.brakes = (D.brakes || 0) + 1;
    $("d-msg").textContent = `急ブレーキ（${Math.round(rate)}km/h/秒）`; $("d-msg").className = "alert";
    setTimeout(() => { if (D && $("d-msg").className === "alert") { $("d-msg").textContent = ""; $("d-msg").className = ""; } }, 6000);
    if ($("opt-brake").checked) say("急ブレーキ");
  }
}
function paint() {
  if (!D) return;
  const now = Date.now(), elapsed = (now - D.t0) / 1000, p = D.prof;
  $("d-elapsed").textContent = `出発から ${mmss(elapsed)}`;
  $("d-speed").textContent = D.lastFix && D.lastFix.spd != null && now - D.fixAt < 10000 ? `${Math.round(D.lastFix.spd)} km/h` : "";
  if (!p) {
    $("d-label").textContent = "出発から"; $("d-big").textContent = mmss(elapsed); $("d-eta").textContent = ""; return;
  }
  const n = p.rem.length, k = D.idx, k2 = Math.min(n - 1, k + 1), f = D.frac;
  let remaining, usualEl;
  if (D.on || D.track.length && D.idx > 0) {
    remaining = p.rem[k] + (p.rem[k2] - p.rem[k]) * f;
    usualEl = p.el[k] + (p.el[k2] - p.el[k]) * f;
    const sinceFix = D.fixAt ? (now - D.fixAt) / 1000 : 0;
    remaining -= Math.min(sinceFix, 30);   // keep counting down between fixes
  } else { remaining = p.total - elapsed; usualEl = 0; }
  const delta = D.idx > 0 ? (D.lastFix ? D.lastFix.t : elapsed) - usualEl : 0;
  $("d-label").textContent = D.on || D.idx === 0 ? "あと" : "あと（ルート外・目安）";
  $("d-big").textContent = mmss(remaining);
  const eta = now + Math.max(0, remaining) * 1000;
  $("d-eta").innerHTML = `到着 <span class="num">${hhmm(eta)}</span> ごろ`;
  $("d-bar").style.width = `${Math.min(100, (k + f) / Math.max(1, n - 1) * 100)}%`;
  const dl = $("d-delta");
  if (D.idx > 2 && Math.abs(delta) >= 30) {
    dl.hidden = false; dl.className = delta > 0 ? "late" : "early";
    dl.textContent = `いつもより ${Math.round(Math.abs(delta) / 60) || "1分弱"}${Math.round(Math.abs(delta) / 60) ? "分" : ""} ${delta > 0 ? "遅れ" : "早い"}`;
  } else if (D.idx > 2) { dl.hidden = false; dl.className = ""; dl.textContent = "いつもどおり"; }
  else dl.hidden = true;
  if (!D.announced && D.idx >= 0 && D.track.length >= 2 && $("opt-voice").checked) {
    D.announced = true; say(`到着予定は ${hhmm(eta).replace(":", "時")}分ごろです`);
  }
}
function stopWatch() {
  if (!D) return;
  navigator.geolocation.clearWatch(D.watch); clearInterval(D.tick);
  try { D.lock && D.lock.release(); } catch {}
}
async function finish(auto) {
  if (!D || D.done) return;
  D.done = true; stopWatch();
  const route = D.route, track = D.track, total = Math.round((Date.now() - D.t0) / 1000);
  const run = D; D = null;
  $("drive").hidden = true; $("home").hidden = false;
  let travelled = 0; for (let i = 1; i < track.length; i++) travelled += dist(track[i - 1].lat, track[i - 1].lon, track[i].lat, track[i].lon);
  if (track.length < 5 || travelled < 300) { toast("GPS の記録が短すぎたので、今回は保存しませんでした。", 5000); renderHome(); return; }
  if (!route.ref) route.ref = buildRef(track);
  const t = timesAt(track, route.ref), hit = t.filter(v => v != null).length / t.length;
  const at = run.t0;
  saveTrack(route.id, at, track);
  if (hit < 0.8) { toast(`いつもと違う道だったようなので（ルートの ${Math.round(hit * 100)}% だけ一致）、「いつも」の計算には入れませんでした。`, 6000); renderHome(); return; }
  route.runs.push({ at, total, t });
  if (route.runs.length > MAX_RUNS) route.runs.splice(0, route.runs.length - MAX_RUNS);
  const ok = await saveRoute(route);
  renderHome();
  toast(`${auto ? "到着を検知しました。" : ""}${mmss(total)} で記録しました${run.brakes ? `（急ブレーキ ${run.brakes} 回）` : ""}${ok ? "" : "。クラウドへの保存に失敗したので、この端末にだけ残しています"}`, 5000);
}
$("d-arrive").addEventListener("click", () => finish(false));
$("d-cancel").addEventListener("click", () => {
  if (!confirm("記録せずに終了しますか？")) return;
  stopWatch(); D = null; $("drive").hidden = true; $("home").hidden = false;
});

(async () => {
  ROUTES = await loadRoutes(); renderHome();
  const db = await cloud();
  $("store-note").textContent = db ? "記録はこのアプリ専用の非公開の保存先にたまります。" : "記録はこの端末にだけ保存されます。";
})();
</script>
</body>
</html>
